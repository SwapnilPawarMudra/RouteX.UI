<p-card header="Vendors">

  <p-table [value]="vendors">

    <ng-template pTemplate="header">
      <tr>
        <th>Company</th>
        <th>City</th>
        <th>Fleet</th>
        <th>Status</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-vendor>
      <tr>
        <td>{{ vendor.company }}</td>
        <td>{{ vendor.city }}</td>
        <td>{{ vendor.fleet }}</td>
        <td>{{ vendor.status }}</td>
      </tr>
    </ng-template>

  </p-table>

</p-card>
