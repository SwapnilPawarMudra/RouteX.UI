<p-card header="Fleet Master">

    <p-table [value]="vehicles">

        <ng-template pTemplate="header">
            <tr>
                <th>Vehicle No</th>
                <th>Type</th>
                <th>Insurance</th>
                <th>Status</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-vehicle>
            <tr>
                <td>{{ vehicle.number }}</td>
                <td>{{ vehicle.type }}</td>
                <td>{{ vehicle.insurance }}</td>
                <td>{{ vehicle.status }}</td>
            </tr>
        </ng-template>

    </p-table>

</p-card>
