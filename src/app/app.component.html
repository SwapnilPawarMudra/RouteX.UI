<p-toast></p-toast>

<p-confirmDialog></p-confirmDialog>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar" [class.collapsed]="sidebarCollapsed">

    <div class="logo">
      <i class="pi pi-truck"></i>

      <span *ngIf="!sidebarCollapsed">
        RouteX
      </span>
    </div>

    <nav class="menu">

      <a routerLink="/" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">

        <i class="pi pi-home"></i>

        <span *ngIf="!sidebarCollapsed">
          Dashboard
        </span>

      </a>

      <a routerLink="/drivers" routerLinkActive="active">

        <i class="pi pi-users"></i>

        <span *ngIf="!sidebarCollapsed">
          Drivers
        </span>

      </a>

      <a routerLink="/vendors" routerLinkActive="active">

        <i class="pi pi-building"></i>

        <span *ngIf="!sidebarCollapsed">
          Vendors
        </span>

      </a>

      <a routerLink="/fleet-master" routerLinkActive="active">

        <i class="pi pi-truck"></i>

        <span *ngIf="!sidebarCollapsed">
          Fleet Master
        </span>

      </a>

      <a routerLink="/admin" routerLinkActive="active">

        <i class="pi pi-cog"></i>

        <span *ngIf="!sidebarCollapsed">
          Admin
        </span>

      </a>

    </nav>

  </aside>

  <!-- Main -->
  <main class="main-content">

    <!-- Topbar -->
    <header class="topbar">

      <div class="topbar-left">

        <!-- Sidebar Toggle Button -->
        <button
          pButton
          type="button"
          icon="pi pi-bars"
          class="p-button-text menu-toggle"
          (click)="toggleSidebar()">
        </button>

        <h2>Dashboard</h2>

      </div>

      <div class="topbar-right">

        <i class="pi pi-bell notification"></i>

        <p-avatar
          label="A"
          shape="circle">
        </p-avatar>

      </div>

    </header>

    <!-- Page Content -->
    <section class="page-content">
      <router-outlet></router-outlet>
    </section>

  </main>

</div>
